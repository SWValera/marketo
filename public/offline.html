<!doctype html>
<html lang="und">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#16a34a">
    <title>Marketo — Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f7f5; color: #17231a; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; box-sizing: border-box; border: 1px solid #dce5dc; border-radius: 1.25rem; background: white; text-align: center; box-shadow: 0 1rem 3rem rgb(15 41 20 / 8%); }
      .mark { width: 3rem; height: 3rem; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 1rem; background: #16a34a; color: white; font-size: 1.5rem; font-weight: 800; }
      h1 { margin: 0 0 .75rem; font-size: 1.4rem; }
      p { margin: .4rem 0; line-height: 1.5; color: #526054; }
      a { width: fit-content; margin: 1.25rem auto 0; display: block; border-radius: .8rem; padding: .8rem 1.1rem; background: #16a34a; color: white; font: inherit; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #14532d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>Нет подключения / Интернет байланысы жоқ</h1>
      <p>Проверьте интернет и попробуйте снова.</p>
      <p>Интернет байланысын тексеріп, қайта көріңіз.</p>
      <a href="/">Повторить / Қайта көру</a>
    </main>
  </body>
</html>
